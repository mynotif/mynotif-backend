name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PRODUCTION: "0"
      DATABASE_ENGINE: django.db.backends.sqlite3
      DATABASE_NAME: ":memory:"
      DATABASE_USER: ""
      DATABASE_PASSWORD: ""
      DATABASE_HOST: ""
      DATABASE_PORT: ""
      SENTRY_DSN: ""
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      ONESIGNAL_API_KEY: ""
      ONESIGNAL_APP_ID: ""
      STRIPE_API_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Reject local environment files
        run: |
          python - <<'PY'
          from pathlib import Path

          parents = Path("src/main/settings.py").resolve().parents
          if any((parent / ".env").exists() for parent in parents):
              raise SystemExit("A .env file must not be loaded by CI")
          PY
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.12"
          enable-cache: true
          cache-dependency-glob: requirements*.txt
      - run: make lock/check
      - run: make virtualenv/test
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
      - run: make lint
      - run: make unittest
      - run: make run/migrations/check
